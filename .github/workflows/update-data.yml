# Daily update of Earth Jukebox's NASA data (round 74). NASA's Scientific Visualization Studio adds a day to most records
# every day. This job decodes only what is new (pipeline/rolling.py), commits the app data, and Vercel redeploys.
# Plankton is not updated: NASA stopped that record on 17 February 2025.
name: Update NASA data

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC, after NASA's morning uploads
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sea surface temperature
        id: sst
        continue-on-error: true
        run: uv run --python 3.11 --with openexr --with numpy --with scipy python pipeline/rolling.py sst
      - name: Sea surface temperature anomaly
        id: ssta
        continue-on-error: true
        run: uv run --python 3.11 --with openexr --with numpy --with scipy python pipeline/rolling.py sst_anomaly
      - name: Sea ice
        id: ice
        continue-on-error: true
        run: uv run --python 3.11 --with openexr --with numpy --with scipy python pipeline/rolling.py ice_daily
      - name: Fires
        id: fire
        continue-on-error: true
        run: uv run --python 3.11 --with openexr --with numpy --with scipy python pipeline/rolling.py fire
      - name: Air temperature (checked against GEOS-FP before it is used)
        id: air
        continue-on-error: true
        run: uv run --python 3.11 --with openexr --with numpy --with scipy --with pillow python pipeline/rolling.py air
      - name: Commit the new data
        run: |
          git config user.name "earth-jukebox-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git status --short | grep -v -E " (mockups/data|pipeline/state)/" || true   # anything else the scripts changed (not committed)
          git add mockups/data pipeline/state
          if git diff --cached --quiet; then echo "No new data."; else git commit -m "Daily NASA data update $(date -u +%Y-%m-%d)" && git pull --rebase --autostash -X theirs && git push; fi
      - name: Report records that did not update
        if: steps.sst.outcome == 'failure' || steps.ssta.outcome == 'failure' || steps.ice.outcome == 'failure' || steps.fire.outcome == 'failure' || steps.air.outcome == 'failure'
        run: |
          echo "sst=${{ steps.sst.outcome }} ssta=${{ steps.ssta.outcome }} ice=${{ steps.ice.outcome }} fire=${{ steps.fire.outcome }} air=${{ steps.air.outcome }}"
          exit 1
