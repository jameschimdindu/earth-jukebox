<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orb variants</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0807;--ink:#f3e7d8;--mute:#b4a28c;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#orb{position:fixed;inset:0}
.top{position:fixed;left:20px;right:20px;top:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.top h1{font-family:Fraunces,serif;font-weight:400;font-size:clamp(22px,3vw,30px)}
.top p{font-size:13px;color:var(--mute);margin-top:4px;max-width:34em}
.top .note{font-size:12px;color:var(--mute);text-align:right}
.panel{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:min(1000px,calc(100vw - 20px));padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(11,8,7,.82);backdrop-filter:blur(10px)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.row .lab{font-size:12px;color:var(--mute);margin-right:4px}
button{font:500 13px Inter;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:99px;padding:8px 12px;cursor:pointer;min-height:38px}
button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button kbd{font:500 11px Inter;opacity:.6;margin-right:6px}
.sw{width:30px;height:30px;border-radius:50%;padding:0;min-height:0}
.sw[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
label{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
input[type=range]{width:90px}
</style>
</head>
<body>
<div class="top">
  <div><h1 id="vName">1. Solid</h1><p id="vDesc"></p></div>
  <div class="note">Test page. The controls are not part of the design.<br>Keys 1 to 6 switch variants.</div>
</div>
<div id="orb" aria-hidden="true"></div>
<div class="panel" role="toolbar" aria-label="Test controls">
  <div class="row" id="variants"><span class="lab">Variant</span></div>
  <div class="row">
    <span class="lab">State</span>
    <span id="states"></span>
    <span class="lab" style="margin-left:10px">Record</span>
    <span id="colors" style="display:flex;gap:6px"></span>
  </div>
  <div class="row">
    <label>Turn <input type="range" id="tilt" min="0" max="90" value="90"></label>
    <label>Rings <input type="range" id="rings" min="10" max="40" value="24"></label>
    <label>Wobble <input type="range" id="wob" min="0" max="2" step="0.1" value="1"></label>
    <label>Split <input type="range" id="split" min="0" max="1" step="0.05" value="0"></label>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=s=>document.querySelector(s);

/* ---------- variants ---------- */
const V=[
 {n:'Solid',d:'One colour: the colour under the needle for the current record.',grad:'none',split:false,globe:false},
 {n:'Gradient across',d:'Each ring takes a colour from the record\'s colour map, from left to right.',grad:'across',split:false,globe:false},
 {n:'Gradient top to bottom',d:'The colour map runs from the top of the orb to the bottom, like latitude: cold at the poles, warm at the middle.',grad:'vertical',split:false,globe:false},
 {n:'Split from the centre',d:'The orb opens into two halves when Juke talks, and a light shows in the gap. It closes when Juke listens.',grad:'across',split:true,globe:false},
 {n:'Globe',d:'The rings are brighter where there is land, so the world shows inside the orb. The globe turns. Vaasa is the bright point.',grad:'none',split:false,globe:true},
 {n:'Globe with gradient',d:'Like Globe, but the land takes the record\'s colour map from pole to equator.',grad:'vertical',split:false,globe:true},
];
let vi=0;
V.forEach((v,i)=>{const b=document.createElement('button');b.innerHTML=`<kbd>${i+1}</kbd>${v.n}`;b.onclick=()=>setVariant(i);$('#variants').appendChild(b);});
function setVariant(i){vi=i;const v=V[i];$('#vName').textContent=`${i+1}. ${v.n}`;$('#vDesc').textContent=v.d;
  [...$('#variants').querySelectorAll('button')].forEach((b,k)=>b.setAttribute('aria-pressed',k===i));
  core.visible=v.split;dot.visible=v.globe;const want=v.globe?46:24;if(rings.length!==want){build(want);$('#rings').value=want;}}
addEventListener('keydown',e=>{if(/^[1-6]$/.test(e.key))setVariant(+e.key-1);});

/* ---------- record colour maps (lifted for contrast on the dark background) ---------- */
const RAMPS={Sea:['#3f7fe0','#5fd0e0','#f2c060','#ff7a5c'],Air:['#8a7cff','#5fc0f0','#f4d36a','#ff6a50'],Ice:['#6fa8d0','#a8d8f0','#e6f4fb','#ffffff'],
  Plants:['#d0b050','#9fd06a','#4fcf8a','#3fb0a0'],Fire:['#ff4a3c','#ff8a5c','#ffb070','#ffe08a'],Neutral:['#d9d4cc','#d9d4cc','#d9d4cc','#d9d4cc']};
let rampT=RAMPS.Sea.map(c=>new THREE.Color(c)),ramp=rampT.map(c=>c.clone());
Object.entries(RAMPS).forEach(([k,r])=>{const b=document.createElement('button');b.className='sw';b.style.background=`linear-gradient(135deg,${r.join(',')})`;b.title=k;b.setAttribute('aria-label',k);b.setAttribute('aria-pressed',k==='Sea');
  b.onclick=()=>{rampT=r.map(c=>new THREE.Color(c));document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x===b));};$('#colors').appendChild(b);});
const tmp=new THREE.Color();
function rampAt(x){x=Math.min(.999,Math.max(0,x))*3;const i=Math.floor(x),f=x-i;return tmp.copy(ramp[i]).lerp(ramp[i+1],f);}

/* ---------- scene ---------- */
const host=$('#orb');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(32,1,.1,100);cam.position.set(0,.35,9);cam.lookAt(0,.35,0);
function size(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.position.z=innerWidth<innerHeight?12:9;cam.updateProjectionMatrix();}addEventListener('resize',size);size();
const tiltG=new THREE.Group(),spinG=new THREE.Group();scene.add(tiltG);tiltG.add(spinG);tiltG.position.y=.55;
const SEG=240,R=1.3;let rings=[];
const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,vertexColors:true,
  vertexShader:`attribute vec4 c;varying vec4 vc;varying float vz;void main(){vc=c;vz=(modelMatrix*vec4(position,1.)).z;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec4 vc;varying float vz;void main(){float a=mix(.22,1.,smoothstep(-1.4,1.4,vz));gl_FragColor=vec4(vc.rgb,vc.a*a);}`});
function build(n){rings.forEach(r=>{spinG.remove(r.line);r.line.geometry.dispose();});rings=[];
  for(let i=0;i<n;i++){const y=-1+2*(i+.5)/n;const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array((SEG+1)*3),3));g.setAttribute('c',new THREE.BufferAttribute(new Float32Array((SEG+1)*4),4));
    const line=new THREE.Line(g,mat);spinG.add(line);rings.push({line,y,r:Math.sqrt(1-y*y),seed:Math.random()*100,i});}}
build(24);
$('#rings').oninput=e=>build(+e.target.value);
let tilt=90,wob=1,splitSlider=0;$('#tilt').oninput=e=>tilt=+e.target.value;$('#wob').oninput=e=>wob=+e.target.value;$('#split').oninput=e=>splitSlider=+e.target.value;

/* light in the split gap */
const coreTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();
const core=new THREE.Sprite(new THREE.SpriteMaterial({map:coreTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));core.scale.set(.2,2.4,1);tiltG.parent.add(core);core.position.y=.55;core.visible=false;
const dot=new THREE.Sprite(new THREE.SpriteMaterial({map:coreTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));dot.scale.set(.32,.32,1);scene.add(dot);dot.visible=false;

/* land mask */
let land=null;const img=new Image();img.crossOrigin='anonymous';img.src='https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/earth-topology.png';
img.onload=()=>{const c=document.createElement('canvas');c.width=360;c.height=180;const g=c.getContext('2d');g.drawImage(img,0,0,360,180);const d=g.getImageData(0,0,360,180).data;land=new Uint8Array(360*180);for(let i=0;i<land.length;i++)land[i]=d[i*4]>12?1:0;};
const isLand=(lat,lon)=>{if(!land)return 0;let x=Math.floor(((lon+180)%360+360)%360),y=Math.floor(90-lat);y=Math.min(179,Math.max(0,y));return land[y*360+x];};

/* ---------- sound ---------- */
let state='idle',AC,an,data,mic,osc,level=0,smooth=0;
const STATES=[['idle','Idle'],['speaking','Juke talking'],['listening','You talking (mic)'],['thinking','Thinking'],['music','Music']];
STATES.forEach(([s,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.s=s;b.setAttribute('aria-pressed',s==='idle');b.onclick=()=>setState(s);$('#states').appendChild(b);});
function ensure(){if(AC)return;AC=new AudioContext();an=AC.createAnalyser();an.fftSize=512;data=new Uint8Array(512);}
const rms=()=>{an.getByteTimeDomainData(data);let s=0;for(const v of data){const x=(v-128)/128;s+=x*x;}return Math.sqrt(s/data.length);};
async function setState(s){state=s;$('#states').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s));ensure();if(osc){osc.stop();osc=null;}
  if(s==='listening'&&!mic){try{mic=await navigator.mediaDevices.getUserMedia({audio:true});AC.createMediaStreamSource(mic).connect(an);}catch(e){alert('Microphone blocked: '+e.message);}}
  if(s==='music'){const g=AC.createGain();osc=AC.createOscillator();osc.type='triangle';osc.connect(g);g.connect(an);g.connect(AC.destination);osc.start();const N=[262,294,330,392,440,392,330,494,523,440];let k=0;
    const step=()=>{if(state!=='music'||!osc)return;osc.frequency.setTargetAtTime(N[k++%N.length],AC.currentTime,.02);g.gain.setValueAtTime(.16,AC.currentTime);g.gain.exponentialRampToValueAtTime(.03,AC.currentTime+.32);setTimeout(step,360);};step();}}

/* ---------- animate ---------- */
const n3=(x,y,z)=>Math.sin(x*1.7+z)*Math.cos(y*1.3-z*.7)+.5*Math.sin(x*3.1-y*2.3+z*1.9);
const t0=performance.now();let spinA=0,globeRot=-21.6,splitCur=0;const P=new THREE.Vector3(),M=new THREE.Matrix4();
function loop(now){const t=(now-t0)/1000,v=V[vi];
  if(state==='speaking'){level=Math.max(0,Math.sin(t*9))*Math.max(0,Math.sin(t*2.3+1))*.9;}
  else if(state==='listening'||state==='music'){level=an?Math.min(1,rms()*(state==='music'?6:5)):0;} else level=0;
  smooth+=(level-smooth)*(level>smooth?.35:.08);
  ramp.forEach((c,i)=>c.lerp(rampT[i],.06));
  const base=.055*wob,amp=(state==='thinking'?.05:0)+smooth*.32*wob;
  const splitTarget=v.split?Math.max(splitSlider,state==='speaking'?.25+smooth*.6:state==='thinking'?.18:state==='music'?.1+smooth*.4:0):splitSlider;
  splitCur+=(splitTarget-splitCur)*.08;
  if(!v.globe){spinA+=(state==='thinking'?.9:.18+smooth*.4)*.016;spinG.rotation.y=spinA;}else{spinG.rotation.y=0;globeRot+=(.12+smooth*.25+(state==='thinking'?.4:0))*.016*57.3;}
  tiltG.rotation.set(.35*(v.globe?.45:1),0,THREE.MathUtils.degToRad(tilt));tiltG.scale.setScalar(1+smooth*.06);tiltG.updateMatrixWorld();
  M.copy(spinG.matrixWorld);
  const n=rings.length;
  rings.forEach((ring,i)=>{const pos=ring.line.geometry.attributes.position.array,col=ring.line.geometry.attributes.c.array;
    const ripple=state==='listening'?Math.sin(i*.7-t*8)*smooth*.15:0;
    const side=ring.y>0?1:-1,off=side*splitCur*.55;
    for(let k=0;k<=SEG;k++){const a=k/SEG*Math.PI*2,cx=Math.cos(a),cz=Math.sin(a);
      let d=1+base*n3(cx*1.5+ring.seed,cz*1.5,t*.5+i*.2)-.035*wob*Math.max(0,Math.sin(a*2+ring.seed)-.92)*12+amp*n3(cx*3+i*.4,cz*3,t*2.2+ring.seed)+ripple;
      if(state==='thinking')d+=.06*Math.sin(a*3+t*3+i*.5);
      const rr=ring.r*d*R,y=ring.y*R*(1+amp*.15*Math.sin(t*3+i))+off;
      pos[k*3]=cx*rr;pos[k*3+1]=y;pos[k*3+2]=cz*rr;
      let c,alpha=.9;
      if(v.globe||v.grad==='vertical'){P.set(cx*rr,y,cz*rr).applyMatrix4(M).sub(tiltG.position);}
      if(v.grad==='across')c=rampAt(i/(n-1));
      else if(v.grad==='vertical')c=rampAt(1-Math.abs(P.y/R));
      else c=rampAt(.62);
      if(v.globe){const lat=Math.asin(Math.max(-1,Math.min(1,P.y/(R*1.02))))*57.3,lon=Math.atan2(P.x,P.z)*57.3+globeRot;const L=isLand(lat,lon);
        if(L){alpha=1;c=(v.grad==='none'?rampAt(.62):c).clone().lerp(new THREE.Color(1,1,1),.3);}else{alpha=.13;c=(v.grad==='none'?rampAt(.62):c).clone().multiplyScalar(.7);}}
      col[k*4]=c.r;col[k*4+1]=c.g;col[k*4+2]=c.b;col[k*4+3]=alpha;}
    ring.line.geometry.attributes.position.needsUpdate=true;ring.line.geometry.attributes.c.needsUpdate=true;});
  if(v.split){core.material.color.copy(rampAt(.5));core.material.opacity=Math.min(1,splitCur*2.2);core.scale.set(.15+splitCur*.9,2.6,1);}
  if(v.globe){const lat=63.1*Math.PI/180,lon=(21.6-globeRot)*Math.PI/180;P.set(Math.sin(lon)*Math.cos(lat)*R,Math.sin(lat)*R,Math.cos(lon)*Math.cos(lat)*R);
    dot.position.copy(P).add(tiltG.position);dot.material.color.copy(rampAt(.8));dot.material.opacity=P.z>-.2?1:.15;dot.scale.setScalar(.28+smooth*.25);}
  renderer.render(scene,cam);requestAnimationFrame(loop);}
{const q=new URLSearchParams(location.search);setVariant(Math.max(0,(+q.get('v')||1)-1));if(q.get('s'))setTimeout(()=>setState(q.get('s')),50);if(q.get('r')){const b=[...document.querySelectorAll('.sw')].find(x=>x.title===q.get('r'));b&&b.click();}}requestAnimationFrame(loop);
window.__orb={setVariant,get vi(){return vi}};
</script>
</body>
</html>
