<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Sharing image variants</title>
<style>
@font-face{font-family:Geist;src:url(../fonts/geist/Geist-Variable.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'Geist Mono';src:url(../fonts/geist/GeistMono-Variable.woff2) format('woff2');font-weight:100 900}
html,body{margin:0;background:#0b0807}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<script>
/* Sharing image mockups. ?v=1..4. Colours: black, white, the SST accent. The globe is NASA's own SST picture (SVS 5101, 12 Nov 2026) */
const V=+(new URLSearchParams(location.search).get('v')||1);
const K='#0b0807',W='243,231,216',A='95,208,224';
const c=document.getElementById('c'),g=c.getContext('2d');
const img=new Image();img.src='../data/nasa/sst.jpg';
Promise.all([new Promise(r=>img.onload=r),document.fonts.load('300 72px Geist'),document.fonts.load('500 16px Geist'),document.fonts.load('400 16px "Geist Mono"')]).then(draw);

function src(){const t=document.createElement('canvas');t.width=img.width;t.height=img.height;const x=t.getContext('2d');x.drawImage(img,0,0);return x.getImageData(0,0,t.width,t.height);}
/* orthographic globe from the equirectangular picture */
function globe(cx,cy,R,lat0,lon0,clip){const S=src(),out=g.getImageData(0,0,1200,630),d=out.data,p0=lat0*Math.PI/180;
  for(let y=Math.max(0,Math.floor(cy-R));y<Math.min(630,cy+R);y++)for(let x=Math.max(0,Math.floor(cx-R));x<Math.min(1200,cx+R);x++){
    if(clip&&!clip(x))continue;const nx=(x-cx)/R,ny=-(y-cy)/R,r2=nx*nx+ny*ny;if(r2>1)continue;const nz=Math.sqrt(1-r2);
    const lat=Math.asin(ny*Math.cos(p0)+nz*Math.sin(p0)),lon=lon0*Math.PI/180+Math.atan2(nx,nz*Math.cos(p0)-ny*Math.sin(p0));
    let u=((lon/Math.PI+1)/2)%1;if(u<0)u+=1;const v=.5-lat/Math.PI;const sx=Math.min(S.width-1,Math.floor(u*S.width)),sy=Math.min(S.height-1,Math.floor(v*S.height));
    const si=(sy*S.width+sx)*4,di=(y*1200+x)*4,l=.55+.45*Math.max(0,nx*-.45+ny*.55+nz*.7),e=Math.min(1,(1-Math.sqrt(r2))*R/1.5);
    for(let k=0;k<3;k++)d[di+k]=d[di+k]*(1-e)+S.data[si+k]*l*e;}
  g.putImageData(out,0,0);}
function glow(cx,cy,R,a=.28){const gr=g.createRadialGradient(cx,cy,R*.9,cx,cy,R*1.9);gr.addColorStop(0,`rgba(${A},${a})`);gr.addColorStop(.35,`rgba(${A},${a*.35})`);gr.addColorStop(1,`rgba(${A},0)`);g.fillStyle=gr;g.fillRect(0,0,1200,630);}
function rings(cx,cy,from,step,n,a=.07){g.lineWidth=1;for(let i=0;i<n;i++){g.strokeStyle=`rgba(${W},${a*(1-i/n)})`;g.beginPath();g.arc(cx,cy,from+i*step,0,Math.PI*2);g.stroke();}}
function stars(n,seed=7){let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<n;i++){g.fillStyle=`rgba(${W},${.16+r()*.3})`;g.fillRect(r()*1200,r()*630,1.4,1.4);}}
function logo(x,y,s=1){g.save();g.translate(x,y);g.scale(s,s);g.strokeStyle=`rgb(${A})`;g.lineWidth=2.4;g.lineCap='round';[[4,14,18],[10,8,24],[16,3,29],[22,9,23],[28,13,19]].forEach(([px,a,b])=>{g.beginPath();g.moveTo(px,a);g.lineTo(px,b);g.stroke();});
  g.fillStyle=`rgb(${W})`;g.font='600 17px Geist';g.textBaseline='middle';const t1='EARTH';g.letterSpacing='3px';g.fillText(t1,44,16);const w=g.measureText(t1).width;g.font='400 17px Geist';g.fillText('JUKEBOX',44+w+10,16);g.letterSpacing='0px';g.restore();}
function heading(x,y,size,align='left',lh=size*1.12){g.textAlign=align;g.textBaseline='alphabetic';g.font=`300 ${size}px Geist`;g.letterSpacing=`${-size*.045}px`;
  g.fillStyle=`rgb(${W})`;g.fillText('Close your eyes.',x,y);const l2a='Hear the ',l2b='Earth',l2c='.';
  const wa=g.measureText(l2a).width,wb=g.measureText(l2b).width,wc=g.measureText(l2c).width,tot=wa+wb+wc;let sx=align==='center'?x-tot/2:x;g.textAlign='left';
  g.fillText(l2a,sx,y+lh);g.fillStyle=`rgb(${A})`;g.fillText(l2b,sx+wa,y+lh);g.fillStyle=`rgb(${W})`;g.fillText(l2c,sx+wa+wb,y+lh);g.letterSpacing='0px';}
function line(t,x,y,align='left',size=20,a=.64,font='Geist',w=400){g.textAlign=align;g.font=`${w} ${size}px ${font}`;g.fillStyle=`rgba(${W},${a})`;g.fillText(t,x,y);}
function url(x,y,align='left'){line('heartheearth.vercel.app',x,y,align,16,.64,'"Geist Mono"');}

function draw(){g.fillStyle=K;g.fillRect(0,0,1200,630);
  if(V===1){ /* globe: the NASA picture on a sphere, text on the left */
    stars(140);rings(880,315,300,28,12,.06);glow(880,315,250);globe(880,315,250,30,-20);
    logo(72,64);heading(72,300,72);line("Juke plays NASA's view of Earth as music",72,448);line('and tells you what each sound means.',72,480);url(72,566);
  }else if(V===2){ /* split: the two halves of the globe hold the heading between them, like the short-screen start page */
    stars(140);const R=230,cy=330;rings(600,cy,R+30,30,14,.05);glow(250,cy,R*.9,.18);glow(950,cy,R*.9,.18);
    globe(600-350,cy,R,30,-20,x=>x<600-350);globe(600+350,cy,R,30,-20,x=>x>=600+350);
    logo(600-123,64);heading(600,298,64,'center',72);line('Earth as music, explained by a voice.',600,404,'center');url(600,566,'center');
  }else if(V===3){ /* sound line: the colours of NASA's picture along 20° W, from the Arctic to Antarctica, as a row of bars */
    stars(90);logo(72,64);heading(72,236,80,'left',88);
    const S=src(),xx=Math.round((180-20)/360*S.width),n=96,x0=72,x1=1128,bw=(x1-x0)/n;
    for(let i=0;i<n;i++){const sy=Math.floor((.03+i/n*.82)*S.height),si=(sy*S.width+xx)*4,r=S.data[si],gg=S.data[si+1],b=S.data[si+2];const grey=Math.max(r,gg,b)-Math.min(r,gg,b)<36;
      const x=x0+i*bw+bw*.2,w=bw*.6;if(grey){g.fillStyle=`rgba(${W},.16)`;g.fillRect(x,446,w,4);}else{const h=24+((r-b+255)/510)*120;g.fillStyle=`rgb(${r},${gg},${b})`;g.beginPath();g.roundRect(x,448-h/2,w,h,w/2);g.fill();}}
    line("Sea temperature colours along 20° W, Arctic to Southern Ocean. NASA, 12 November 2026.",72,566,'left',14,.64,'"Geist Mono"');
  }else{ /* rings: the globe small in the centre of the sound field, the heading at the bottom */
    stars(160);rings(600,250,130,26,22,.09);glow(600,250,120,.3);globe(600,250,120,30,-20);
    logo(72,64);heading(600,486,48,'center',56);url(1128,64,'right');
  }
  document.title='ready';}
</script>
</body>
</html>
